[workspace]
authors = ["tomato_hpc <awellfrog@163.com>"]
channels = ["conda-forge"]
name = "minimind"
platforms = ["linux-aarch64", "linux-64"]
version = "0.1.0"

[tasks]
check-gpu = "python -c \"import torch; print(f'CUDA available: {torch.cuda.is_available()}'); print(f'PyTorch version: {torch.__version__}'); print(f'CUDA version: {torch.version.cuda if torch.cuda.is_available() else None}')\""
smoke = "python scripts/smoke_test.py"
debug-step = "python scripts/debug_train_step.py"
demo = "env PYTHON=python bash trainer/run.sh"
test = "python -m unittest discover -s tests -v"

[system-requirements]
cuda = "13.0"

[dependencies]
python = "3.12.*"

# Keep the same core dependencies as requirements-aarch64.txt.
[pypi-dependencies]
torch = "==2.14.0"
torchvision = "==0.29.0"
numpy = "==1.26.4"
pillow = "==13.0.0"
transformers = "==4.57.1"
tokenizers = "==0.22.2"

[feature.tracking.pypi-dependencies]
swanlab = "==0.6.8"

[environments]
default = { features = [] }
tracking = { features = ["tracking"] }

[pypi-options]
index-url = "https://pypi.org/simple"
